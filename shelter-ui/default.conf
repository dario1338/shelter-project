server {
    listen 10000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Used by the platform health check and by the delivery pipeline
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

        # Reports which commit this image was built from; read by the delivery pipeline
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    # Vite emits content-hashed file names, so these can be cached for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html references the hashed files and must never be served stale
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: unknown paths are handled by the client-side router
    location / {
        try_files $uri $uri/ /index.html;
    }
}