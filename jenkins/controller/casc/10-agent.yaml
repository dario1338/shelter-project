# The build agent: started by the controller over SSH (container jenkins-agent-1).
# Its private key is the credential "jenkins-agent-key" (30-credentials.yaml).

jenkins:
  nodes:
    - permanent:
        name: "docker-agent-1"
        labelString: "docker arm64"
        mode: EXCLUSIVE
        numExecutors: 2
        remoteFS: "/home/jenkins/agent"
        retentionStrategy: "always"
        launcher:
          ssh:
            host: "jenkins-agent-1"
            port: 22
            credentialsId: "jenkins-agent-key"
            sshHostKeyVerificationStrategy:
              manuallyTrustedKeyVerificationStrategy:
                requireInitialManualTrust: false
