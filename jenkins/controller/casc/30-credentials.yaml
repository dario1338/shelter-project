# Credentials. The values are NOT here: each ${...} is a Docker secret (file in
# /run/secrets) or a non-secret environment variable, see compose.yaml and README.md.
# The ids are the ones the Jenkinsfiles and jobs refer to; do not rename them.

credentials:
  system:
    domainCredentials:
      - credentials:
          # GitHub API access for the multibranch job (scanning, commit status)
          - usernamePassword:
              scope: GLOBAL
              id: "github-credentials"
              description: "GitHub token for the multibranch job"
              username: "${GITHUB_USERNAME}"
              password: "${github_token}"
          # Docker Hub: push and pull of the application images
          - usernamePassword:
              scope: GLOBAL
              id: "dockerhub-credentials"
              description: "Docker Hub access token"
              username: "${DOCKERHUB_USERNAME}"
              password: "${dockerhub_token}"
          - string:
              scope: GLOBAL
              id: "sonarqube-token"
              description: "SonarQube analysis token"
              secret: "${sonarqube_token}"
          - string:
              scope: GLOBAL
              id: "render-api-key"
              description: "Render API key (deployments)"
              secret: "${render_api_key}"
          # Private key the controller uses to start the agent over SSH
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "jenkins-agent-key"
              description: "SSH key for the jenkins-agent-1 build agent"
              username: "jenkins"
              privateKeySource:
                directEntry:
                  privateKey: "${jenkins_agent_key}"
          # Deploy key (write access, this repository only) with which the delivery pipelines record
          # releases on the "releases" branch. It cannot change main: the ruleset on main has no bypass.
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "releases-deploy-key"
              description: "Deploy key for the releases branch (release records)"
              username: "git"
              privateKeySource:
                directEntry:
                  privateKey: "${releases_deploy_key}"
