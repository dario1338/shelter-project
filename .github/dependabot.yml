version: 2
updates:
  # Backend dependencies (Spring Boot, Testcontainers, JaCoCo, ...)
  - package-ecosystem: "maven"
    directory: "/shelter-api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    # Do not rebase open PRs automatically; each rebase would trigger a full CI build
    rebase-strategy: "disabled"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    groups:
      # One PR for all minor and patch updates; major updates stay separate
      maven-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Base images in the API Dockerfile
  - package-ecosystem: "docker"
    directory: "/shelter-api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    rebase-strategy: "disabled"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    ignore:
      # Java and Maven versions are a deliberate decision (Java 21 LTS);
      # images are pulled fresh on every build (--pull)
      - dependency-name: "eclipse-temurin"
      - dependency-name: "maven"

  # Base image of the reverse proxy
  - package-ecosystem: "docker"
    directory: "/shelter-proxy"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    rebase-strategy: "disabled"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    ignore:
      # Stay on the nginx stable branch (1.28); mainline is not used in production
      - dependency-name: "nginx"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # Base image of the Jenkins build agent
  - package-ecosystem: "docker"
    directory: "/jenkins/agent"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    rebase-strategy: "disabled"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"