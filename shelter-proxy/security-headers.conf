# The headers every response of the proxy carries, also the error ones. nginx does not inherit add_header
# into a location that has an add_header of its own, so every location includes this file instead of
# relying on the server block.
add_header X-Content-Type-Options 'nosniff' always;
add_header X-Frame-Options 'DENY' always;
add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
