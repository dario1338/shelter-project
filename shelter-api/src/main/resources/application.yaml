spring:
  application:
    name: shelter-api
  datasource:
    url: jdbc:postgresql://localhost:5433/shelter_database
    username: postgres
    password: postgres
  servlet:
    multipart:
      # A photo is at most 5 MB (DogImageService checks it again); the request adds a little for the headers.
      max-file-size: 5MB
      max-request-size: 6MB

app:
  security:
    jwt:
      # Required, no default on purpose: the application refuses to start without it.
      secret: ${JWT_SECRET}
      expiration: 15m
    refresh:
      expiration: 7d
    csrf:
      # Required: comma-separated list of origins that may call the cookie-based endpoints
      # (refresh and logout), for example the public URL of the application.
      allowed-origins: ${ALLOWED_ORIGINS}
  admin:
    # Optional: the initial admin is created at startup only when both values are set.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  storage:
    supabase:
      # Required, no defaults on purpose: the application refuses to start without them.
      # The key can write to the whole project, so it exists only in the environment, never in the repository.
      url: ${SUPABASE_URL}
      service-key: ${SUPABASE_SERVICE_KEY}
      bucket: ${SUPABASE_BUCKET}
